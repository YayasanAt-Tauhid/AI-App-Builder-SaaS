# wrangler.toml — Cloudflare Workers deployment for the AI App Builder API.
#
# This mirrors the PRD's edge stack (Workers · D1 · R2 · KV · Durable Objects ·
# Queues). The Node server (src/index.ts) is the local-dev path; this file is the
# production edge path (src/worker.ts). Resource IDs below are placeholders —
# create the resources (see README "Going to production") and paste the IDs in,
# or let `wrangler` prompt you on first deploy.
#
# Provider/Clerk/Stripe keys are secrets: `wrangler secret put ANTHROPIC_API_KEY` etc.

name = "aiab-api"
main = "src/worker.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
SHARD_COUNT = "4"
WEB_ORIGIN = "*"

[[d1_databases]]
binding = "DB_0"
database_name = "aiab-shard-0"
database_id = "PLACEHOLDER_DB_0"
migrations_dir = "migrations"

[[d1_databases]]
binding = "DB_1"
database_name = "aiab-shard-1"
database_id = "PLACEHOLDER_DB_1"
migrations_dir = "migrations"

[[d1_databases]]
binding = "DB_2"
database_name = "aiab-shard-2"
database_id = "PLACEHOLDER_DB_2"
migrations_dir = "migrations"

[[d1_databases]]
binding = "DB_3"
database_name = "aiab-shard-3"
database_id = "PLACEHOLDER_DB_3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aiab-blobs"

[[kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_KV"

[[queues.producers]]
binding = "QUEUE"
queue = "aiab-jobs"

[[queues.consumers]]
queue = "aiab-jobs"

[[durable_objects.bindings]]
name = "CREDIT_METER"
class_name = "CreditMeterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditMeterDO"]
